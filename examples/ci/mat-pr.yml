# MAT UI 测试接入 PR 门禁（示例）——放在你仓库的 .github/workflows/ 下
# 前置：一台插着 Android 测试机的 self-hosted runner（labels: [self-hosted, android]）
name: MAT UI Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # PR 评论需要

jobs:
  ui-test:
    runs-on: [self-hosted, android]
    steps:
      - uses: actions/checkout@v4

      - uses: vlmpilot/mat-uitest@main
        id: mat
        with:
          package: com.example.shop     # 你的被测 App 包名
          cases-dir: cases              # 你的用例目录（MAT DSL JSON）
          artifact-name: mat-report-${{ github.event.pull_request.number }}

      - name: PR 评论（测试结果 + 报告链接）
        if: always()
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ steps.mat.outputs.artifact-name }}
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('pr-summary.md')
              ? fs.readFileSync('pr-summary.md', 'utf8')
              : '本次运行未生成摘要，请看本次 run 的日志。';
            const body = summary + '\n\n📄 报告 artifact：' +
              (process.env.ARTIFACT_NAME || 'mat-report') + '（在本次 run 的 Artifacts 区下载）';
            if (context.issue.number) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.payload.pull_request.number, body,
              });
            }
