[project]
name = "mat-uitest"
description = "MAT — AI 移动端 App UI 自动化测试（引擎与 CLI，开源核心 AGPL-3.0）"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "vlmpilot" }]
# 搜索元数据的唯一用途是「被搜到」：领域词优先（ui-testing / mobile-testing），
# 再列技术栈与可替代对象（uiautomator2 / adb / appium / maestro）。
keywords = [
    "ui-testing",
    "mobile-testing",
    "android",
    "ios",
    "automation",
    "test-automation",
    "ui-automation",
    "regression-testing",
    "e2e",
    "uiautomator2",
    "adb",
    "appium",
    "maestro",
    "ai-testing",
    "llm",
    "mcp",
]
# 无 License :: classifier —— PEP 639 下 `license` SPDX 表达式已表达许可证，
# 两者并存会被 PyPI 判为冲突（这是 0.5.2 页面「未声明许可证」的修法）。
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    # PyPI 合法值只有 "Testing :: Acceptance"（无 "Acceptance Testing"）。
    # 写错会在 twine upload 最后一步被 400 拒收（2026-10-10 实际发生）。
    "Topic :: Software Development :: Testing :: Acceptance",
]
dynamic = ["version"]
dependencies = [
    "uiautomator2>=3.0",
    "pydantic>=2.7",
    "requests>=2.31",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "pytest>=8", "pytest-cov>=5", "openpyxl>=3.1"]
image = ["opencv-python-headless>=4.8"]
import = ["openpyxl>=3.1"]
mcp = ["mcp>=2.0"]
ios = ["facebook-wda>=1.5"]

[project.scripts]
mat = "insta_engine.__main__:main"
mat-mcp = "insta_engine.mcp_server:main"

# PyPI 页面侧栏链接（0.5.2 时全空 ⇒ 页面上既无源码入口也无文档入口）
[project.urls]
Homepage = "https://github.com/vlmpilot/mat-uitest"
Repository = "https://github.com/vlmpilot/mat-uitest"
Documentation = "https://github.com/vlmpilot/mat-uitest/tree/main/docs"
Changelog = "https://github.com/vlmpilot/mat-uitest/blob/main/CHANGELOG.md"
Issues = "https://github.com/vlmpilot/mat-uitest/issues"

[tool.setuptools.dynamic]
version = {attr = "insta_engine.__version__"}

[build-system]
# >=77：PEP 639 的 `license` SPDX 字符串与 `license-files` 需要该版本才被解析
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["insta_engine*"]

[tool.setuptools.package-data]
# prompts/*.example：闭源 prompt 的公开兜底模板，随包分发；mat init 播种为工作区 prompts/*.prompt
# skills/*：面向 AI 编码助手的过程知识（mobileapp-testing）。**必须随包分发**——
# 否则 `pip install mat-uitest` 的用户机器上没有 SKILL.md，`mat skill install` 无料可装。
insta_engine = ["web/*.html", "web/*.js", "web/*.css", "prompts/*.example",
                 "console_dist/*.html", "console_dist/assets/*", "console_dist/*.svg", "console_dist/*.ico",
                 "skills/*/*.md", "skills/*/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 显式规则集（默认规则集随 ruff 版本漂移，会让 CI 莫名变红）
# BLE001/S110 有意排除：引擎大量 best-effort except 是"证据采集/兜底不阻塞主流程"的设计决策
select = ["E", "F", "W", "I", "UP", "B"]
# E501：报告/前端模板的长 HTML 行与中文文案不可折叠（ruff 无 formatter 接管前的取舍）
ignore = ["E501"]
