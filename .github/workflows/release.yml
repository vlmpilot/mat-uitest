name: release

# 只在**公开仓**跑：发布物必须与公开源码逐字节一致（GitHub 看到的 = pip 装到的）。
# 主仓的发布走本地脚本（从导出目录构建），这个 workflow 在主仓会被 if 直接跳过。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'vlmpilot/mat-uitest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # attestation 需要 OIDC
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 tag 与版本单源一致
        run: |
          V=$(python -c "import sys; sys.path.insert(0, 'engine'); import insta_engine; print(insta_engine.__version__)")
          echo "版本单源: v$V / 触发 tag: $GITHUB_REF_NAME"
          test "v$V" = "$GITHUB_REF_NAME" || {
            echo "::error::tag 与版本单源不一致（改了 __init__.py 但 tag 打错？）"
            exit 1
          }

      - name: 构建 sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build engine
          python -m twine check engine/dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: engine/dist/*

      - name: 来源证明（build provenance）
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "engine/dist/*"

  publish:
    needs: build
    if: github.repository == 'vlmpilot/mat-uitest'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mat-uitest/
    permissions:
      id-token: write        # PyPI Trusted Publishing：不需要长期 token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
